<!DOCTYPE html>
<html>
<head>
    <title>Book Donation Form</title>
</head>
<body>

<h1>Book Donation Form</h1>

<form>

<h2>Donor Details</h2>

Name:<br>
<input type="text"><br><br>

Email:<br>
<input type="email"><br><br>

Password:<br>
<input type="password"><br><br>

Phone:<br>
<input type="text"><br><br>

<h2>Book Information</h2>

Book Title:<br>
<input type="text"><br><br>

Author:<br>
<input type="text"><br><br>

Number of Books:<br>
<input type="number"><br><br>

<h2>Extra Notes</h2>

<textarea rows="4" cols="30"></textarea><br><br>

<h2>When Dropping the Book</h2>

Drop-off Date:<br>
<input type="date"><br><br>

<input type="checkbox"> I confirm the books are in good condition.<br><br>

<input type="submit" value="Submit">

</form>

</body>
</html>
