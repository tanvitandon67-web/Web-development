<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Animal Fact File</title>
    <style>
        body{
            background-color: darkgreen;
            font-family:georgia,'Times New Roman';
            font-size: 30px;
        }

        .divi{
            background-color: blanchedalmond;
            color: darkslategray;
            width: 400px;
            padding: 10px;
            border: 4px solid rgb(143, 4, 4);
            margin: 10px;
        }
        
        .animal{
            color: forestgreen;
            font-size: 30px;
        }

         .detail{
            color: forestgreen;
            font-size: 20px;
        }

         .Cool{
            color: rgb(255, 160, 105);
            font-size: 20px;
            font-family:cursive;
        }

        
    </style>
</head>
<body>
    <div class="divi">
    <h2 class="animal">Snow leopard</h2>
    <p class="detail">Type :Cat </p>
    <p class="detail">Lives in: Mountain ranges of Central Asia</p>
    <p class="detail">Diet: Deer, goats, and wild sheep</p>
    <p class="Cool">Did you know a Snow Lepord can leap up to 15 metres in one jump</p>
    </div>

    
</body>
</html>
