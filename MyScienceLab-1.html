<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <title>My Science Lab</title>
    <style>
        body{
            background-color: #f4fff4;
            font-family: Georgia, 'Times New Roman', Times, serif      
        }
        .jumbotron{
            background-color: #e6e6ec;
            border-left: 6px solid #ff5a43;
        }

        .jumbotron h1{
            color: #ff5a43;
        }

        .section-title{
            color: #ff5a43;margin: 30px; margin-bottom: 15px;
        }
        p{font-weight: bold;
        margin-top: 5px;}
    </style>
</head>
<body>
    <div class="jumbotron jumbotron-fluid">
        <div class="container">
            <h1>Science lab</h1>
            <p class="lead">Welcome to the amazing science lab sponsered by daddy pig</p>
            <button class="btn btn-primary">Biology</button>
            <button class="btn btn-success">Chemistry</button>
            <button class="btn btn-warning">Physics</button>
            <button class="btn btn-danger">Astronomy</button>


        </div>
    </div>

    <div class="container">
        <h2 class="section-title">Experiments Completed <span class="badge badge-danger">4</span></h2>
        <p>Chemistry <span class="Badge badge-success">7 Experiments</span></p>
        <p>Biology <span class="Badge badge-primary">5 Experiments</span></p>
        <p>Physics <span class="Badge badge-warning">9 Experiments</span></p>
        <p>Astronomy <span class="Badge badge-danger">4 Experiments</span></p>

        <h2 class="section-title">Research progress</h2>
        <p>Chemistry</p>
        <div class="progress mb-3">
            <div class="progress bar bg-success" style="width: 85%">85%</div>
        </div>

         <p>Biology</p>
        <div class="progress mb-3">
        <div class="progress bar bg-primary" style="width: 70%">70%</div>
        </div>

         <p>Physics</p>
        <div class="progress mb-3">
            <div class="progress bar bg-warning" style="width: 92%">92%</div>
        </div>

         <p>Astronomy</p>
        <div class="progress mb-3">
            <div class="progress bar bg-danger" style="width: 40%">40%

            </div>
        </div>
    </div>    
</body>
</html>
