<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky guess</title>
    <style>
        body {

font-family: Arial, sans-serif;

background: aliceblue;

text-align: center;

padding: 30px;

}

h1 {

color: navy;

}

input {

padding: 8px;

margin: 5px;

border: 2px solid navy;

border-radius: 6px;

width: 220px;

}

button {

background: navy;

color: white;

padding: 10px 25px;

border: none;

border-radius: 20px;

cursor: pointer;

}

#timer {

color: grey;

}

    </style>
</head>
<body>
      <h1>Lucky Draw</h1>
    <p>Enter your name and guess a number to win a Daddy pig plushie <br>as well as meeting Daddy Pig in person!</p>

    <input type="text" id="name" placeholder="Your name" required><br>
    <p id="msg-name"></p>

    <input type="number" id="guess" placeholder="Guess a number (between 1 to 5)" min= "1" max= "6"required><br>
    <p id="msg-guess"></p>

    <button onclick="checkForm()">Try my Luck!</button>
    <p id="result"></p>
    <p id="timer"></p>

    <script>

        var seconds = 0;
        setInterval(function() {
            seconds = seconds + 1;
            document.getElementById("timer").textContent = "You have been here for" + seconds + "seconds";
        },1000);


        function checkForm() {
            var name = document.getElementById("name").value;
            var guess = document.getElementById("guess").value;
            var ok = true;

        if (name == "") {
            document.getElementById("msg-name").textContent = "Please enter your name or else daddy pig will be sad!";
            document.getElementById("msg-name").style.color = "red";
            ok  = false;
        }
        else {
            document.getElementById("msg-name").textContent = "Great Name! Daddy Pig likes it";
            document.getElementById("msg-name").style.color = "green";
        }
    
     
        if (guess == "") {
            document.getElementById("msg-guess").textContent = "Please enter a guess or else daddy pig will be angry!";
            document.getElementById("msg-guess").style.color = "red";
            ok  = false;
        }
        else {
            document.getElementById("msg-guess").textContent = "Great guess! Daddy Pig likes it";
            document.getElementById("msg-guess").style.color = "green";
        }
        if (ok ==true){
            var lucky = Math.floor(Math.random() * 5) + 1;
            if (guess == lucky) {
             document.getElementById("result").textContent = "YOU WIN THE DADDY PIG PLUSHIE AND DADDY PIG WILL BE AT YOUR HOUSE IN 5 SECONDS!" + name + "! The Lucky Number was" + lucky + "!";
            document.getElementById("result").style.color = "green";

            }
            else {
            document.getElementById("result").textContent = "So Close..!" + name + "! The Lucky Number was " + lucky + ". Try again";
            document.getElementById("result").style.color = "navy";

            }
        }
    }
    </script>


</body>
</html>
