<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Icecream menu</title>
    <style>
        body{
            background-color:rgb(255, 221, 247);
            font-family:Arial;
            padding: 30px;
            text-align: center;
        }

        h1{color:rgb(255, 75, 150) ;}

        h1 + p{
            background: #fff4e3;
            padding: 10px 20px;
            border-radius: 8px;
            color: #ff80cc;
            display: inline-block;
        }

        ul{ padding :0; margin-top: 20px;}

        ul >li{
            list-style: none;
            font-size: 18px;
            font-weight: bold;

            color: #ff8ef4;
            padding: 10px 20px;
            margin: 6x auto;
            width: 260;
            background: #f9ffe6;
            border-radius: 8px;
        }

        ul li:nth-child(2) {
            background: #a2d7ff;
            color: #ffffff;
        }

        .desc{
            color: #555;
            margin-top: 20px;
            font-size: 15px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .desc::first-letter{
            font-size: 220%;
            color: #fa3dd1;
            font-weight: bold;
        }

        .links{margin-top: 25px;}
        a{
            color: #ef3be6;
            text-decoration: none;
            font-size: 15px;
            margin: 0 12px;
            padding: 8px 12px;
            border: 2px solid #ca67ff;
            border-radius: 8px;
        }

        a:hover{
            background: #e991f1;
            color: white;
        }


    </style>
</head>

<body>
    
    <h1>My Icecream menu </h1>
    <p>The best icecream shop that you ever been too</p>


    <ul>
       <li>strawberry </li>
        <li> vanilla - chef special  </li>
        <li>Chocolate</li>
        <li>mint   </li>
        <li>mango</li>
    </ul>

    <p class="desc">Every dish on the menu has been made with love and joy</p>
    <a href="#">Order now</a>
    <a href="#">See more</a>
  
</body>
</html>
