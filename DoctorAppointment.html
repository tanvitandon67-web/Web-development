<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor's Appointment Form</title>
</head>
<body>
    <h1><i>Docter Appointment form </i></h1>
    <p>Please fill the form to book your Appointment</p>
    <hr>

    <form>
        <fieldset>
            <legend>Personal Details</legend>

            <label>Your name </label> <br>
            <input type="text" id="name" placeholder="Enter your full name"><br><br>

            <label>Paient ID  </label> <br>
            <input type="password" id="Patient ID" placeholder="Enter your paient id"><br><br>

              <label>Date of birth </label> <br>
            <input type="date" id="Date" placeholder="Enter your date of birth"><br>

           </fieldset>

        <fieldset>
            <legend>Your visit</legend>
            <label>Choose your Doctor</label>
             <select id="Doctor">
            <option value="">Select a doctor</option>
            <option value="Dr.Ray">Dr.Ray:general</option>
            <option value="Dr.Wai">Dr .Wai:general</option>
             <option value="Dr.Ben">Dr Ben:Dentist</option>\
          </select>
          <br><br>
          <label>Why are you visiting?</label><br>
          <input type="radio" name="Reason" value="fever">Fever<br>
          <input type="radio" name="Reason" value="Cold">Cold<br>
          <input type="radio" name="Reason" value="checkup">checkup<br>
          <input type="radio" name="Reason" value="tooth ache">tooth ache<br>
          <input type="radio" name="Reason" value="other">other<br><br>

        <label>Any notes for the doctor</label><br>
        <textarea id="notes" rows="3" cols="35" placeholder="e.g I have a stomach ache for the last 2 days"></textarea>
        </fieldset>
        <br>

        <fieldset>
            <Legend>Preffered Visit days</Legend>
            <input type="checkbox" value="mon">Monday<br>
            <input type="checkbox" value="Tues">Tuesday<br>
            <input type="checkbox" value="w">Wednesday<br>
             <input type="checkbox" value="th">Thursday<br>
            <input type="checkbox" value="mon">Friday<br>
        </fieldset>
        <br>

        <input type="submit" value="Book my Appointment">
        
    </form>

    
</body>  
</html>
