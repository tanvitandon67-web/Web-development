
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
    <title>My Playlist Sorter</title>

    <style>
        body {
            background-color: lavender;
        }

        h1, h3 {
            color: darkviolet;
        }

        .box {
            background: white;
            color: darkviolet;
        }
    </style>
</head>

<body>
    <div class="container py-4">

        <h1 class="mb-1">My Playlist Sorter</h1>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Song Names</h3>

                <button class="btn btn-primary mr-2" onclick="sortAZ()">Sort A to Z</button>
                <button class="btn btn-primary" onclick="sortZA()">Sort Z to A</button>

                <div id="nameResult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Play Counts</h3>

                <button class="btn btn-primary mr-2" onclick="sortLeast()">Least Played First</button>
                <button class="btn btn-primary" onclick="sortMost()">Most Played First</button>

                <div id="countResult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Label Every Play Count</h3>

                <button class="btn btn-primary" onclick="addLabel()">Add Labels</button>

                <div id="labelResult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>

    </div>

    <script>
        var songs = ["DADDY PIG", "MUMMY PIG", "PEDRO PONY", "REBECA RABBIT", "PEPPA PIG"];

        var plays = [555, 24, 670, 50, 25];

        document.getElementById("nameResult").innerHTML = "Songs: " + songs.join(", ");
        document.getElementById("countResult").innerHTML = "Plays: " + plays.join(", ");
        document.getElementById("labelResult").innerHTML = "Press the button above!";

        function sortAZ() {
            songs.sort();
            document.getElementById("nameResult").innerHTML = "A to Z: " + songs.join(", ");
        }

        function sortZA() {
            songs.sort();
            songs.reverse();
            document.getElementById("nameResult").innerHTML = "Z to A: " + songs.join(", ");
        }

        function sortLeast() {
            plays.sort(function(a, b) {
                return a - b;
            });
            document.getElementById("countResult").innerHTML = "Least played: " + plays.join(", ");
        }

        function sortMost() {
            plays.sort(function(a, b) {
                return b - a;
            });
            document.getElementById("countResult").innerHTML = "Most played: " + plays.join(", ");
        }

        function addLabel() {
            var l = plays.map(function(c) {
                return c + " plays";
            });
            document.getElementById("labelResult").innerHTML = "Labelled: " + l.join(", ");
        }
    </script>
</body>
</html>
